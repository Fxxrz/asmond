name: tests

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Syntax check
        run: |
          python3 -m py_compile \
            asmond.py \
            asmond_models.py \
            asmond_formatting.py \
            asmond_metrics_memory.py \
            asmond_process.py \
            asmond_settings.py \
            asmond_powermetrics.py \
            test_asmond.py
      - name: Unit tests
        run: python3 -m unittest -v
      - name: Install-layout smoke test
        run: |
          tmpdir="$(mktemp -d)"
          cp asmond.py asmond_*.py "$tmpdir/"
          cd /tmp
          python3 "$tmpdir/asmond.py" --version
          python3 "$tmpdir/asmond.py" report --mock --json >/tmp/asmond-report.json
